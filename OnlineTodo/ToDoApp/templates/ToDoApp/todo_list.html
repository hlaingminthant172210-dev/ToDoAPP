<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  </head>
  <body class="bg-light">
    <div class="container col-md-5" >
      <div class="row mt-3 mb-5">
        <div class="col-md-15">
          <div class="card">
            <div class="card-header">
              <h1 class="display-7 text-info">
                <i class="fas fa-check-double"></i>
                To-Do List
              </h1>
            </div>
            <div class="card rounded-0">
              <div class="card-body">
                <ul class="list-group">
                <li class="list-group-item">
                  <form action="{% url 'insert_todo'%}" method="post" autocomplete="off">
                    {% csrf_token %}
                    <div class="input-group">
                      <input type="text" class="form-control " placeholder="Add a new task" name="content">
                      <button class="btn btn-outline-primary" type="submit">
                        <i class="fas fa-plus"></i>
                        Add
                      </button>
                    </div>
                  </form>
                </li>
                {% for todo in todo_list %}
                  <li class="list-group-item d-flex justify-content-between align-items-center">

                      {{ todo.content }}

                      <form action="{% url 'delete_todo_item' todo.id %}" method="POST" class="d-inline">
                          {% csrf_token %}
                          <button type="submit" class="btn p-0">
                              <i class="far fa-trash-alt text-danger"></i>
                          </button>
                      </form>

                  </li>
                  {% empty %}
                  <li class="list-group-item">
                      <span class="font-italic">No Info Todo</span>
                  </li>
                  {% endfor %}
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
